repos:
  - repo: local
    hooks:
      - id: gen-badge
        name: Generate badge SVG and PNG
        language: system
        entry: just gen-badge
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, css, javascript, ts, tsx]
